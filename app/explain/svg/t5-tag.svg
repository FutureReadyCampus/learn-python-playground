<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t5s-t t5s-d">
  <title id="t5s-t">보석을 주울 때마다 count 이름표가 다음 숫자로 옮겨 가요</title>
  <desc id="t5s-d">위에 숫자 카드 0, 1, 2, 3이 있고 count 이름표가 0을 가리켜요. 아래에서 Byte가 한 칸씩 가며 보석을 주울 때마다 이름표가 다음 숫자로 옮겨 가요.</desc>
  <style>
    .t5s-tile{fill:var(--panel);stroke:var(--line);stroke-width:3}
    .t5s-gem{fill:var(--warn);stroke:var(--tx);stroke-width:2}
    .t5s-body{fill:var(--panel2);stroke:var(--tx);stroke-width:3}
    .t5s-eye{fill:var(--acc)}
    .t5s-tip{fill:var(--warn)}
    .t5s-line{stroke:var(--tx);stroke-width:3}
    .t5s-card{fill:var(--panel);stroke:var(--line);stroke-width:3}
    .t5s-num{fill:var(--tx);font-size:32px;font-weight:800;text-anchor:middle}
    .t5s-tag{fill:var(--panel2);stroke:var(--acc);stroke-width:3}
    .t5s-hole{fill:var(--panel);stroke:var(--acc);stroke-width:3}
    .t5s-name{fill:var(--acc);font-size:22px;font-weight:700;text-anchor:middle}
    .t5s-str{fill:none;stroke:var(--acc);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <g transform="translate(-230 0)">
  <rect class="t5s-card" x="498" y="170" width="64" height="64" rx="10"/><text class="t5s-num" x="530" y="214">0</text>
  <rect class="t5s-card" x="618" y="170" width="64" height="64" rx="10"/><text class="t5s-num" x="650" y="214">1</text>
  <rect class="t5s-card" x="738" y="170" width="64" height="64" rx="10"/><text class="t5s-num" x="770" y="214">2</text>
  <rect class="t5s-card" x="858" y="170" width="64" height="64" rx="10"/><text class="t5s-num" x="890" y="214">3</text>
  <g id="t5s-tag" style="transform:translate(530px,0px)">
    <rect class="t5s-tag" x="-56" y="64" width="112" height="46" rx="12"/>
    <circle class="t5s-hole" cx="-40" cy="87" r="5"/>
    <text class="t5s-name" x="8" y="95">count</text>
    <path class="t5s-str" d="M0 110 V158 M-9 148 L0 160 L9 148"/>
  </g>
  <rect class="t5s-tile" x="480" y="380" width="100" height="50" rx="10"/>
  <rect class="t5s-tile" x="600" y="380" width="100" height="50" rx="10"/>
  <rect class="t5s-tile" x="720" y="380" width="100" height="50" rx="10"/>
  <rect class="t5s-tile" x="840" y="380" width="100" height="50" rx="10"/>
  <g id="t5s-g1"><path class="t5s-gem" d="M650 360 l16 -18 -16 -18 -16 18z"/></g>
  <g id="t5s-g2"><path class="t5s-gem" d="M770 360 l16 -18 -16 -18 -16 18z"/></g>
  <g id="t5s-g3"><path class="t5s-gem" d="M890 360 l16 -18 -16 -18 -16 18z"/></g>
  <g id="t5s-bot" style="transform:translate(530px,382px)">
    <line class="t5s-line" x1="0" y1="-70" x2="0" y2="-84"/><circle class="t5s-tip" cx="0" cy="-88" r="6"/>
    <rect class="t5s-body" x="-24" y="-70" width="48" height="66" rx="20"/>
    <rect class="t5s-eye" x="-15" y="-56" width="30" height="12" rx="6"/>
  </g>
  </g>
</svg>
