<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="bdraw-t bdraw-d">
  <title id="bdraw-t">서랍에서 열쇠 찾기</title>
  <desc id="bdraw-d">서랍 네 개가 한 줄로 있어요. 손 표시가 왼쪽 서랍부터 하나씩 열어 봐요. 빈 서랍 두 개는 건너뛰고, 세 번째 서랍에서 열쇠를 찾으면 그만 찾아요. 네 번째 서랍은 열지 않아요.</desc>
  <style>
    .bdraw-chest{fill:var(--panel);stroke:var(--line);stroke-width:3}
    .bdraw-front{fill:var(--panel2);stroke:var(--line);stroke-width:3;transition:stroke .5s}
    .bdraw-knob{fill:var(--line)}
    .bdraw-in{opacity:0;transition:opacity .5s}
    .bdraw-g.on .bdraw-in{opacity:1}
    .bdraw-g.on .bdraw-front{stroke:var(--warn)}
    .bdraw-empty{fill:var(--dim);font-size:22px;font-weight:700;text-anchor:middle}
    .bdraw-key{fill:none;stroke:var(--warn);stroke-width:6;stroke-linecap:round}
    .bdraw-num{fill:var(--dim);font-size:22px;font-weight:700;text-anchor:middle}
    .bdraw-hand{fill:var(--warn);stroke:var(--tx);stroke-width:3}
    #bdraw-hand{transition:transform .9s ease,opacity .5s}
    #bdraw-row{transition:opacity .5s}
    #bdraw-stop{fill:var(--warn);font-size:40px;font-weight:800;text-anchor:middle;transition:opacity .5s}
    @media (prefers-reduced-motion:reduce){#bdraw-hand,#bdraw-row,#bdraw-stop,.bdraw-in,.bdraw-front{transition:none}}
  </style>
  <g id="bdraw-row">
    <rect class="bdraw-chest" x="70" y="200" width="820" height="200" rx="14"/>
    <g id="bdraw-d1" class="bdraw-g" transform="translate(180 300)">
      <rect class="bdraw-front" x="-86" y="-70" width="172" height="140" rx="10"/>
      <circle class="bdraw-knob" cx="0" cy="40" r="9"/>
      <text class="bdraw-empty bdraw-in" y="0">비었어요</text>
      <text class="bdraw-num" y="130">1</text>
    </g>
    <g id="bdraw-d2" class="bdraw-g" transform="translate(380 300)">
      <rect class="bdraw-front" x="-86" y="-70" width="172" height="140" rx="10"/>
      <circle class="bdraw-knob" cx="0" cy="40" r="9"/>
      <text class="bdraw-empty bdraw-in" y="0">비었어요</text>
      <text class="bdraw-num" y="130">2</text>
    </g>
    <g id="bdraw-d3" class="bdraw-g" transform="translate(580 300)">
      <rect class="bdraw-front" x="-86" y="-70" width="172" height="140" rx="10"/>
      <circle class="bdraw-knob" cx="0" cy="40" r="9"/>
      <g class="bdraw-in">
        <circle class="bdraw-key" cx="-34" cy="-10" r="18"/>
        <path class="bdraw-key" d="M-16 -10 H44 M30 -10 V6 M44 -10 V6"/>
      </g>
      <text class="bdraw-num" y="130">3</text>
    </g>
    <g id="bdraw-d4" class="bdraw-g" transform="translate(780 300)">
      <rect class="bdraw-front" x="-86" y="-70" width="172" height="140" rx="10"/>
      <circle class="bdraw-knob" cx="0" cy="40" r="9"/>
      <text class="bdraw-num" y="130">4</text>
    </g>
  </g>
  <g id="bdraw-hand" style="transform:translate(40px,170px)">
    <path class="bdraw-hand" d="M-22 -34 H22 V0 L0 24 L-22 0 Z"/>
  </g>
  <text id="bdraw-stop" x="780" y="160">그만!</text>
</svg>
