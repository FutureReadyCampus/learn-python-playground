<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="cwk-t cwk-d">
  <title id="cwk-t">Walker 틀로 만든 객체가 기억한 만큼 걷기</title>
  <desc id="cwk-d">위에 Walker 틀이 있고, 틀에서 w 카드가 나와요. 카드에는 steps 3이 적혀 있어요. 아래 길에서 Byte가 카드에 적힌 만큼 세 칸 걷고 보석을 주워요.</desc>
  <style>
    .cwk-mold{fill:var(--panel2);stroke:var(--line);stroke-width:3;stroke-dasharray:10 6}
    .cwk-lbl{fill:var(--dim);font-size:22px;font-weight:700;text-anchor:middle}
    .cwk-card{fill:var(--panel);stroke:var(--warn);stroke-width:4}
    #cwk-card.on .cwk-card{stroke:var(--ok);stroke-width:5}
    .cwk-name{fill:var(--tx);font-size:28px;font-weight:800;font-family:'JetBrains Mono',monospace}
    .cwk-attr{fill:var(--acc);font-size:24px;font-weight:700;font-family:'JetBrains Mono',monospace}
    #cwk-val{fill:var(--tx);font-size:30px;font-weight:800}
    .cwk-sep{stroke:var(--line);stroke-width:3}
    .cwk-tile{fill:var(--panel);stroke:var(--line);stroke-width:3}
    .cwk-num{fill:var(--dim);font-size:18px;text-anchor:middle}
    .cwk-gem{fill:var(--warn);stroke:var(--tx);stroke-width:2}
    .cwk-body{fill:var(--panel2);stroke:var(--tx);stroke-width:3}
    .cwk-eye{fill:var(--acc)}
    .cwk-tip{fill:var(--warn)}
    .cwk-line{stroke:var(--tx);stroke-width:3}
  </style>
  <g id="cwk-mold">
    <rect class="cwk-mold" x="160" y="70" width="240" height="150" rx="20"/>
    <text class="cwk-lbl" x="280" y="152">Walker 틀</text>
  </g>
  <g id="cwk-card" style="transform:translate(520px,80px)">
    <rect class="cwk-card" x="0" y="0" width="260" height="130" rx="14"/>
    <text class="cwk-name" x="20" y="44">w</text>
    <line class="cwk-sep" x1="16" y1="60" x2="244" y2="60"/>
    <text class="cwk-attr" x="20" y="106">steps</text>
    <text id="cwk-val" x="170" y="108">?</text>
  </g>
  <g>
    <rect class="cwk-tile" x="260" y="330" width="100" height="70" rx="12"/>
    <rect class="cwk-tile" x="370" y="330" width="100" height="70" rx="12"/>
    <rect class="cwk-tile" x="480" y="330" width="100" height="70" rx="12"/>
    <rect class="cwk-tile" x="590" y="330" width="100" height="70" rx="12"/>
    <text class="cwk-num" x="420" y="428">1</text><text class="cwk-num" x="530" y="428">2</text><text class="cwk-num" x="640" y="428">3</text>
  </g>
  <g id="cwk-gem"><path class="cwk-gem" d="M640 316 l16 -18 -16 -18 -16 18z"/></g>
  <g id="cwk-bot" style="transform:translate(310px,340px)">
    <line class="cwk-line" x1="0" y1="-70" x2="0" y2="-84"/><circle class="cwk-tip" cx="0" cy="-88" r="6"/>
    <rect class="cwk-body" x="-24" y="-70" width="48" height="66" rx="20"/>
    <rect class="cwk-eye" x="-15" y="-56" width="30" height="12" rx="6"/>
  </g>
</svg>
