<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ww-t ww-d">
  <title id="ww-t">Byte가 막힐 때까지 걷기</title>
  <desc id="ww-d">Byte가 한 칸 갈 때마다 앞이 막혔는지 물어요. 위의 말풍선이 대답을 보여 줘요. 막히지 않으면 또 걷고, 벽 앞에서 막히면 반복을 끝내고 보석을 주워요.</desc>
  <style>
    .ww-tile{fill:var(--panel);stroke:var(--line);stroke-width:3}
    .ww-wall{fill:var(--line);stroke:var(--tx);stroke-width:3}
    .ww-gem{fill:var(--warn);stroke:var(--tx);stroke-width:2}
    .ww-body{fill:var(--panel2);stroke:var(--tx);stroke-width:3}
    .ww-eye{fill:var(--acc)}
    .ww-tip{fill:var(--warn)}
    .ww-line{stroke:var(--tx);stroke-width:3}
    .ww-bub{fill:var(--panel);stroke:var(--line);stroke-width:3}
    #ww-ask{fill:var(--tx);font-size:26px;font-weight:800;text-anchor:middle}
    #ww-askbox.on .ww-bub{stroke:var(--warn)}
    #ww-askbox.on #ww-ask{fill:var(--warn)}
  </style>
  <g transform="translate(-233 0)">
  <g id="ww-askbox">
    <rect class="ww-bub" x="553" y="120" width="320" height="66" rx="18"/>
    <text id="ww-ask" x="713" y="163">막혔나요?</text>
  </g>
  <rect class="ww-tile" x="480" y="320" width="100" height="50" rx="10"/>
  <rect class="ww-tile" x="590" y="320" width="100" height="50" rx="10"/>
  <rect class="ww-tile" x="700" y="320" width="100" height="50" rx="10"/>
  <rect class="ww-tile" x="810" y="320" width="100" height="50" rx="10"/>
  <rect class="ww-wall" x="920" y="240" width="26" height="130" rx="4"/>
  <g id="ww-gem"><path class="ww-gem" d="M860 300 l16 -18 -16 -18 -16 18z"/></g>
  <g id="ww-bot" style="transform:translate(530px,322px)">
    <line class="ww-line" x1="0" y1="-70" x2="0" y2="-84"/><circle class="ww-tip" cx="0" cy="-88" r="6"/>
    <rect class="ww-body" x="-24" y="-70" width="48" height="66" rx="20"/>
    <rect class="ww-eye" x="-15" y="-56" width="30" height="12" rx="6"/>
  </g>
  </g>
</svg>
