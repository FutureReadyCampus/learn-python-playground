<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="fp-t fp-d">
  <title id="fp-t">화분 네 개에 물 주기</title>
  <desc id="fp-d">화분 네 개가 한 줄로 놓여 있고, 물뿌리개가 왼쪽부터 화분 위로 옮겨 가며 물을 줘요. 물을 받은 화분에는 싹이 나요.</desc>
  <style>
    .fp-pot{fill:var(--panel2);stroke:var(--line);stroke-width:3;transition:stroke .5s}
    .fp-soil{fill:var(--line)}
    .fp-sprout{opacity:0;transition:opacity .6s}
    .fp-stem{stroke:var(--ok);stroke-width:4;fill:none;stroke-linecap:round}
    .fp-leaf{fill:var(--ok)}
    .fp-g.on .fp-sprout{opacity:1}
    .fp-g.on .fp-pot{stroke:var(--ok)}
    .fp-num{fill:var(--dim);font-size:22px;font-weight:700;text-anchor:middle}
    .fp-can{fill:var(--warn);stroke:var(--tx);stroke-width:3}
    .fp-handle{fill:none;stroke:var(--tx);stroke-width:3}
    .fp-drop{fill:var(--acc)}
    #fp-can{transition:transform .9s ease,opacity .5s}
    #fp-count{fill:var(--tx);font-size:44px;font-weight:800;text-anchor:middle;transition:opacity .5s}
    #fp-pots{transition:opacity .5s}
    @media (prefers-reduced-motion:reduce){#fp-can,#fp-count,#fp-pots,.fp-sprout,.fp-pot{transition:none}}
  </style>
  <g id="fp-pots">
    <g id="fp-pot1" class="fp-g" transform="translate(200 360)">
      <path class="fp-pot" d="M-46 0 H46 L34 72 H-34 Z"/>
      <ellipse class="fp-soil" cx="0" cy="0" rx="46" ry="9"/>
      <g class="fp-sprout">
        <path class="fp-stem" d="M0 0 V-46"/>
        <ellipse class="fp-leaf" cx="-16" cy="-40" rx="16" ry="8" transform="rotate(-25 -16 -40)"/>
        <ellipse class="fp-leaf" cx="16" cy="-50" rx="16" ry="8" transform="rotate(25 16 -50)"/>
      </g>
      <text class="fp-num" y="112">1</text>
    </g>
    <g id="fp-pot2" class="fp-g" transform="translate(400 360)">
      <path class="fp-pot" d="M-46 0 H46 L34 72 H-34 Z"/>
      <ellipse class="fp-soil" cx="0" cy="0" rx="46" ry="9"/>
      <g class="fp-sprout">
        <path class="fp-stem" d="M0 0 V-46"/>
        <ellipse class="fp-leaf" cx="-16" cy="-40" rx="16" ry="8" transform="rotate(-25 -16 -40)"/>
        <ellipse class="fp-leaf" cx="16" cy="-50" rx="16" ry="8" transform="rotate(25 16 -50)"/>
      </g>
      <text class="fp-num" y="112">2</text>
    </g>
    <g id="fp-pot3" class="fp-g" transform="translate(600 360)">
      <path class="fp-pot" d="M-46 0 H46 L34 72 H-34 Z"/>
      <ellipse class="fp-soil" cx="0" cy="0" rx="46" ry="9"/>
      <g class="fp-sprout">
        <path class="fp-stem" d="M0 0 V-46"/>
        <ellipse class="fp-leaf" cx="-16" cy="-40" rx="16" ry="8" transform="rotate(-25 -16 -40)"/>
        <ellipse class="fp-leaf" cx="16" cy="-50" rx="16" ry="8" transform="rotate(25 16 -50)"/>
      </g>
      <text class="fp-num" y="112">3</text>
    </g>
    <g id="fp-pot4" class="fp-g" transform="translate(800 360)">
      <path class="fp-pot" d="M-46 0 H46 L34 72 H-34 Z"/>
      <ellipse class="fp-soil" cx="0" cy="0" rx="46" ry="9"/>
      <g class="fp-sprout">
        <path class="fp-stem" d="M0 0 V-46"/>
        <ellipse class="fp-leaf" cx="-16" cy="-40" rx="16" ry="8" transform="rotate(-25 -16 -40)"/>
        <ellipse class="fp-leaf" cx="16" cy="-50" rx="16" ry="8" transform="rotate(25 16 -50)"/>
      </g>
      <text class="fp-num" y="112">4</text>
    </g>
  </g>
  <g id="fp-can" style="transform:translate(60px,190px)">
    <rect class="fp-can" x="-34" y="-26" width="68" height="52" rx="10"/>
    <path class="fp-can" d="M34 -10 L72 -36 L78 -26 L40 8 Z"/>
    <path class="fp-handle" d="M-34 -10 C-62 -10 -62 20 -34 20"/>
    <circle class="fp-drop" cx="86" cy="2" r="6"/><circle class="fp-drop" cx="90" cy="30" r="6"/><circle class="fp-drop" cx="84" cy="58" r="6"/>
  </g>
  <text id="fp-count" x="480" y="190">4번</text>
</svg>
