<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="aw-t aw-d">
  <title id="aw-t">Byte가 오른손 규칙으로 미로 걷기</title>
  <desc id="aw-d">세 칸씩 세 줄인 작은 미로에서 Byte가 규칙대로 걸어요. 오른쪽이 비면 돌아서 걷고, 앞이 열리면 걷고, 막히면 왼쪽으로 돌아요. 아래에 Byte가 보는 쪽 화살표가 바뀌고, 마지막에 보석을 주워요.</desc>
  <style>
    .aw-path{fill:var(--panel2);stroke:var(--line);stroke-width:3}
    .aw-hedge{fill:var(--ok);opacity:.3;stroke:var(--line);stroke-width:3}
    .aw-gem{fill:var(--warn);stroke:var(--tx);stroke-width:2}
    .aw-body{fill:var(--panel2);stroke:var(--tx);stroke-width:3}
    .aw-eye{fill:var(--acc)}
    .aw-tip{fill:var(--warn)}
    .aw-line{stroke:var(--tx);stroke-width:3}
    .aw-lbl{fill:var(--dim);font-size:22px;font-weight:700;text-anchor:end}
    #aw-face{fill:var(--warn);font-size:30px;font-weight:800}
  </style>
  <rect class="aw-path" x="330" y="110" width="100" height="100"/>
  <rect class="aw-path" x="430" y="110" width="100" height="100"/>
  <rect class="aw-hedge" x="530" y="110" width="100" height="100"/>
  <rect class="aw-hedge" x="330" y="210" width="100" height="100"/>
  <rect class="aw-path" x="430" y="210" width="100" height="100"/>
  <rect class="aw-hedge" x="530" y="210" width="100" height="100"/>
  <rect class="aw-hedge" x="330" y="310" width="100" height="100"/>
  <rect class="aw-path" x="430" y="310" width="100" height="100"/>
  <rect class="aw-path" x="530" y="310" width="100" height="100"/>
  <g id="aw-gem"><path class="aw-gem" d="M580 382 l16 -18 -16 -18 -16 18z"/></g>
  <g id="aw-bot" style="transform:translate(380px,202px)">
    <line class="aw-line" x1="0" y1="-70" x2="0" y2="-84"/><circle class="aw-tip" cx="0" cy="-88" r="6"/>
    <rect class="aw-body" x="-24" y="-70" width="48" height="66" rx="20"/>
    <rect class="aw-eye" x="-15" y="-56" width="30" height="12" rx="6"/>
  </g>
  <text class="aw-lbl" x="490" y="462">보는 쪽</text>
  <text id="aw-face" x="504" y="464">→</text>
</svg>
