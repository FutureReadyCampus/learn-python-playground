<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="b1w-t b1w-d">
  <title id="b1w-t">Byte가 한 줄씩 따라 하며 보석 줍기</title>
  <desc id="b1w-d">길 네 칸 위에 Byte가 서 있고 앞의 세 칸에 보석이 하나씩 있어요. 한 칸 가고 줍기를 차례로 하면 보석이 하나씩 사라지고 주운 개수가 늘어요.</desc>
  <style>
    .b1w-tile{fill:var(--panel);stroke:var(--line);stroke-width:3}
    .b1w-gem{fill:var(--warn);stroke:var(--tx);stroke-width:2}
    .b1w-body{fill:var(--panel2);stroke:var(--tx);stroke-width:3}
    .b1w-eye{fill:var(--acc)}
    .b1w-tip{fill:var(--warn)}
    .b1w-line{stroke:var(--tx);stroke-width:3}
    .b1w-num{fill:var(--dim);font-size:20px;text-anchor:middle}
    #b1w-cnt{fill:var(--tx);font-size:30px;font-weight:800;text-anchor:middle}
  </style>
  <text id="b1w-cnt" x="510" y="180">주운 보석 0개</text>
  <rect class="b1w-tile" x="280" y="320" width="100" height="50" rx="10"/>
  <rect class="b1w-tile" x="400" y="320" width="100" height="50" rx="10"/>
  <rect class="b1w-tile" x="520" y="320" width="100" height="50" rx="10"/>
  <rect class="b1w-tile" x="640" y="320" width="100" height="50" rx="10"/>
  <text class="b1w-num" x="450" y="398">1</text><text class="b1w-num" x="570" y="398">2</text><text class="b1w-num" x="690" y="398">3</text>
  <g id="b1w-g1"><path class="b1w-gem" d="M450 300 l16 -18 -16 -18 -16 18z"/></g>
  <g id="b1w-g2"><path class="b1w-gem" d="M570 300 l16 -18 -16 -18 -16 18z"/></g>
  <g id="b1w-g3"><path class="b1w-gem" d="M690 300 l16 -18 -16 -18 -16 18z"/></g>
  <g id="b1w-bot" style="transform:translate(330px,322px)">
    <line class="b1w-line" x1="0" y1="-70" x2="0" y2="-84"/><circle class="b1w-tip" cx="0" cy="-88" r="6"/>
    <rect class="b1w-body" x="-24" y="-70" width="48" height="66" rx="20"/>
    <rect class="b1w-eye" x="-15" y="-56" width="30" height="12" rx="6"/>
  </g>
</svg>
