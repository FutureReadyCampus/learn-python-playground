<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t7h-t t7h-d">
  <title id="t7h-t">도우미를 새로 만들어 일 시키기</title>
  <desc id="t7h-d">가운데가 끊긴 길이에요. Byte가 왼쪽 보석을 줍고, 건너편에 모자 쓴 도우미가 새로 나타나 helper 이름표가 붙어요. 도우미가 한 칸 가서 오른쪽 보석을 주워요.</desc>
  <style>
    .t7h-tile{fill:var(--panel);stroke:var(--line);stroke-width:3}
    .t7h-gem{fill:var(--warn);stroke:var(--tx);stroke-width:2}
    .t7h-body{fill:var(--panel2);stroke:var(--tx);stroke-width:3}
    .t7h-hbody{fill:var(--panel);stroke:var(--acc);stroke-width:3}
    .t7h-hat{fill:var(--acc);stroke:var(--tx);stroke-width:3}
    .t7h-eye{fill:var(--acc)}
    .t7h-heye{fill:var(--warn)}
    .t7h-tip{fill:var(--warn)}
    .t7h-line{stroke:var(--tx);stroke-width:3}
    .t7h-tag rect{fill:var(--panel2);stroke:var(--acc);stroke-width:3}
    .t7h-tag text{fill:var(--tx);font-size:22px;font-weight:800;text-anchor:middle}
    .t7h-gap{fill:var(--dim);font-size:20px;font-weight:700;text-anchor:middle}
  </style>
  <rect class="t7h-tile" x="230" y="320" width="100" height="50" rx="10"/>
  <rect class="t7h-tile" x="340" y="320" width="100" height="50" rx="10"/>
  <rect class="t7h-tile" x="560" y="320" width="100" height="50" rx="10"/>
  <rect class="t7h-tile" x="670" y="320" width="100" height="50" rx="10"/>
  <text class="t7h-gap" x="500" y="352">끊긴 길</text>
  <g id="t7h-g1"><path class="t7h-gem" d="M390 300 l16 -18 -16 -18 -16 18z"/></g>
  <g id="t7h-g2"><path class="t7h-gem" d="M720 300 l16 -18 -16 -18 -16 18z"/></g>
  <g id="t7h-bot" style="transform:translate(280px,322px)">
    <line class="t7h-line" x1="0" y1="-70" x2="0" y2="-84"/><circle class="t7h-tip" cx="0" cy="-88" r="6"/>
    <rect class="t7h-body" x="-24" y="-70" width="48" height="66" rx="20"/>
    <rect class="t7h-eye" x="-15" y="-56" width="30" height="12" rx="6"/>
  </g>
  <g id="t7h-help" style="transform:translate(610px,322px)">
    <rect class="t7h-hbody" x="-24" y="-70" width="48" height="66" rx="20"/>
    <rect class="t7h-hat" x="-22" y="-84" width="44" height="14" rx="4"/>
    <rect class="t7h-hat" x="-12" y="-100" width="24" height="18" rx="4"/>
    <rect class="t7h-heye" x="-15" y="-56" width="30" height="12" rx="6"/>
    <g class="t7h-tag">
      <rect x="-60" y="-156" width="120" height="40" rx="10"/>
      <text x="0" y="-128">helper</text>
    </g>
  </g>
</svg>
