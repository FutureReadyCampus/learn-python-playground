<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="vt-t vt-d">
  <title id="vt-t">gem_count 이름표가 옮겨 가요</title>
  <desc id="vt-d">위에는 숫자 0, 1, 2, 3이 있고 gem_count 이름표가 그중 하나를 화살표로 가리켜요. 아래에서 Byte가 보석을 하나 주울 때마다 이름표가 다음 숫자로 옮겨 가요.</desc>
  <style>
    .vt-card{fill:var(--panel2);stroke:var(--line);stroke-width:3}
    .vt-num{fill:var(--tx);font-size:40px;font-weight:800;text-anchor:middle}
    .vt-tagbox{fill:var(--panel2);stroke:var(--warn);stroke-width:4}
    .vt-tagtx{fill:var(--tx);font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;text-anchor:middle}
    .vt-arrow{stroke:var(--warn);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .vt-tile{fill:var(--panel);stroke:var(--line);stroke-width:3}
    .vt-gem{fill:var(--warn);stroke:var(--tx);stroke-width:2}
    .vt-body{fill:var(--panel2);stroke:var(--tx);stroke-width:3}
    .vt-eye{fill:var(--acc)}
    .vt-tip{fill:var(--warn)}
    .vt-line{stroke:var(--tx);stroke-width:3}
  </style>
  <g transform="translate(-230 0)">
  <rect class="vt-card" x="520" y="170" width="80" height="70" rx="10"/><text class="vt-num" x="560" y="220">0</text>
  <rect class="vt-card" x="620" y="170" width="80" height="70" rx="10"/><text class="vt-num" x="660" y="220">1</text>
  <rect class="vt-card" x="720" y="170" width="80" height="70" rx="10"/><text class="vt-num" x="760" y="220">2</text>
  <rect class="vt-card" x="820" y="170" width="80" height="70" rx="10"/><text class="vt-num" x="860" y="220">3</text>
  <g id="vt-tag" style="transform:translate(560px,0px)">
    <path class="vt-tagbox" d="M-78 70 H58 L78 92 L58 114 H-78 Z"/>
    <text class="vt-tagtx" x="-6" y="100">gem_count</text>
    <path class="vt-arrow" d="M0 116 V164 M-12 150 L0 166 L12 150"/>
  </g>
  <rect class="vt-tile" x="510" y="380" width="100" height="50" rx="10"/>
  <rect class="vt-tile" x="610" y="380" width="100" height="50" rx="10"/>
  <rect class="vt-tile" x="710" y="380" width="100" height="50" rx="10"/>
  <rect class="vt-tile" x="810" y="380" width="100" height="50" rx="10"/>
  <g id="vt-g1"><path class="vt-gem" d="M660 360 l16 -18 -16 -18 -16 18z"/></g>
  <g id="vt-g2"><path class="vt-gem" d="M760 360 l16 -18 -16 -18 -16 18z"/></g>
  <g id="vt-g3"><path class="vt-gem" d="M860 360 l16 -18 -16 -18 -16 18z"/></g>
  <g id="vt-bot" style="transform:translate(560px,382px)">
    <line class="vt-line" x1="0" y1="-70" x2="0" y2="-84"/><circle class="vt-tip" cx="0" cy="-88" r="6"/>
    <rect class="vt-body" x="-24" y="-70" width="48" height="66" rx="20"/>
    <rect class="vt-eye" x="-15" y="-56" width="30" height="12" rx="6"/>
  </g>
  </g>
</svg>
