<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="iw-t iw-d">
  <title id="iw-t">Byte가 for와 while로 복도 걷기</title>
  <desc id="iw-d">Byte가 먼저 정해진 두 칸을 걷고, 그다음 막힐 때까지 더 걸어 끝 칸의 스위치를 켜요.</desc>
  <style>
    .iw-tile{fill:var(--panel);stroke:var(--line);stroke-width:3}
    .iw-num{fill:var(--dim);font-size:18px;text-anchor:middle}
    .iw-sw{fill:var(--panel2);stroke:var(--warn);stroke-width:3}
    .iw-knob{fill:var(--dim)}
    #iw-sw.on .iw-sw{fill:var(--ok)}
    #iw-sw.on .iw-knob{fill:var(--tx)}
    .iw-body{fill:var(--panel2);stroke:var(--tx);stroke-width:3}
    .iw-eye{fill:var(--acc)}
    .iw-tip{fill:var(--warn)}
    .iw-line{stroke:var(--tx);stroke-width:3}
    #iw-bot{transition:transform 1s ease}
    #iw-count{fill:var(--tx);font-size:30px;font-weight:800;text-anchor:middle}
    @media (prefers-reduced-motion:reduce){#iw-bot{transition:none}}
  </style>
  <text id="iw-count" x="480" y="190">시작</text>
  <g>
    <rect class="iw-tile" x="180" y="320" width="120" height="50" rx="10"/>
    <rect class="iw-tile" x="340" y="320" width="120" height="50" rx="10"/>
    <rect class="iw-tile" x="500" y="320" width="120" height="50" rx="10"/>
    <rect class="iw-tile" x="660" y="320" width="120" height="50" rx="10"/>
    <text class="iw-num" x="240" y="398">0</text><text class="iw-num" x="400" y="398">1</text><text class="iw-num" x="560" y="398">2</text><text class="iw-num" x="720" y="398">3</text>
  </g>
  <g id="iw-sw">
    <rect class="iw-sw" x="696" y="296" width="48" height="24" rx="8"/>
    <circle class="iw-knob" cx="720" cy="308" r="6"/>
  </g>
  <g id="iw-bot" style="transform:translate(240px,322px)">
    <line class="iw-line" x1="0" y1="-70" x2="0" y2="-84"/><circle class="iw-tip" cx="0" cy="-88" r="6"/>
    <rect class="iw-body" x="-24" y="-70" width="48" height="66" rx="20"/>
    <rect class="iw-eye" x="-15" y="-56" width="30" height="12" rx="6"/>
  </g>
</svg>
