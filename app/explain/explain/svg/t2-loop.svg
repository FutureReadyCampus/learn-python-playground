<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t2l-t t2l-d">
  <title id="t2l-t">같은 두 동작을 세 번 되풀이하는 Byte</title>
  <desc id="t2l-d">칸 네 개 중 뒤의 세 칸에 보석이 있어요. Byte가 한 칸 가서 보석 줍기를 세 번 되풀이하고, 몇 번째인지 숫자가 바뀌어요.</desc>
  <style>
    .t2l-tile{fill:var(--panel);stroke:var(--line);stroke-width:3}
    .t2l-gem{fill:var(--warn);stroke:var(--tx);stroke-width:2}
    .t2l-body{fill:var(--panel2);stroke:var(--tx);stroke-width:3}
    .t2l-eye{fill:var(--acc)}
    .t2l-tip{fill:var(--warn)}
    .t2l-line{stroke:var(--tx);stroke-width:3}
    #t2l-count{fill:var(--tx);font-size:34px;font-weight:800;text-anchor:middle}
  </style>
  <g transform="translate(-230 0)">
  <text id="t2l-count" x="710" y="200">0번째</text>
  <rect class="t2l-tile" x="480" y="320" width="100" height="50" rx="10"/>
  <rect class="t2l-tile" x="600" y="320" width="100" height="50" rx="10"/>
  <rect class="t2l-tile" x="720" y="320" width="100" height="50" rx="10"/>
  <rect class="t2l-tile" x="840" y="320" width="100" height="50" rx="10"/>
  <g id="t2l-g1"><path class="t2l-gem" d="M650 300 l16 -18 -16 -18 -16 18z"/></g>
  <g id="t2l-g2"><path class="t2l-gem" d="M770 300 l16 -18 -16 -18 -16 18z"/></g>
  <g id="t2l-g3"><path class="t2l-gem" d="M890 300 l16 -18 -16 -18 -16 18z"/></g>
  <g id="t2l-bot" style="transform:translate(530px,322px)">
    <line class="t2l-line" x1="0" y1="-70" x2="0" y2="-84"/><circle class="t2l-tip" cx="0" cy="-88" r="6"/>
    <rect class="t2l-body" x="-24" y="-70" width="48" height="66" rx="20"/>
    <rect class="t2l-eye" x="-15" y="-56" width="30" height="12" rx="6"/>
  </g>
  </g>
</svg>
