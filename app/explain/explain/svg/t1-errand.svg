<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t1e-t t1e-d">
  <title id="t1e-t">심부름 쪽지대로 장바구니가 가게를 찾아가요</title>
  <desc id="t1e-d">길 위에 집, 빵집, 과일 가게가 차례로 있어요. 장바구니가 집에서 한 칸씩 옮겨 가 과일 가게에서 사과를 담아요.</desc>
  <style>
    .t1e-road{fill:var(--panel);stroke:var(--line);stroke-width:3}
    .t1e-dash{stroke:var(--line);stroke-width:3;stroke-dasharray:18 14}
    .t1e-wall{fill:var(--panel2);stroke:var(--line);stroke-width:3}
    .t1e-roof{fill:var(--panel2);stroke:var(--dim);stroke-width:3}
    .t1e-shop.on .t1e-roof{fill:var(--acc);stroke:var(--tx)}
    .t1e-door{fill:var(--line)}
    .t1e-name{fill:var(--tx);font-size:22px;font-weight:700;text-anchor:middle}
    .t1e-apple{fill:var(--bad);stroke:var(--tx);stroke-width:2}
    .t1e-leaf{fill:var(--ok)}
    .t1e-bask{fill:var(--warn);stroke:var(--tx);stroke-width:3}
    .t1e-hand{fill:none;stroke:var(--tx);stroke-width:3}
  </style>
  <rect class="t1e-road" x="60" y="380" width="840" height="60" rx="12"/>
  <line class="t1e-dash" x1="80" y1="410" x2="880" y2="410"/>
  <g id="t1e-home" class="t1e-shop">
    <path class="t1e-roof" d="M90 230 L190 170 L290 230 Z"/>
    <rect class="t1e-wall" x="110" y="230" width="160" height="140"/>
    <rect class="t1e-door" x="170" y="300" width="40" height="70" rx="4"/>
    <text class="t1e-name" x="190" y="160">집</text>
  </g>
  <g id="t1e-s1" class="t1e-shop">
    <path class="t1e-roof" d="M370 230 L470 170 L570 230 Z"/>
    <rect class="t1e-wall" x="390" y="230" width="160" height="140"/>
    <rect class="t1e-door" x="450" y="300" width="40" height="70" rx="4"/>
    <text class="t1e-name" x="470" y="160">빵집</text>
  </g>
  <g id="t1e-s2" class="t1e-shop">
    <path class="t1e-roof" d="M650 230 L750 170 L850 230 Z"/>
    <rect class="t1e-wall" x="670" y="230" width="160" height="140"/>
    <rect class="t1e-door" x="730" y="300" width="40" height="70" rx="4"/>
    <text class="t1e-name" x="750" y="160">과일 가게</text>
  </g>
  <g id="t1e-apple"><circle class="t1e-apple" cx="700" cy="270" r="18"/><ellipse class="t1e-leaf" cx="706" cy="248" rx="8" ry="4"/></g>
  <g id="t1e-bask" style="transform:translate(190px,400px)">
    <path class="t1e-hand" d="M-30 -30 C-30 -70 30 -70 30 -30"/>
    <g id="t1e-got"><circle class="t1e-apple" cx="0" cy="-34" r="16"/><ellipse class="t1e-leaf" cx="6" cy="-54" rx="8" ry="4"/></g>
    <path class="t1e-bask" d="M-44 -30 H44 L32 10 H-32 Z"/>
  </g>
</svg>
