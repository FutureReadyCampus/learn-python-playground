<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="b8a-t b8a-d">
  <title id="b8a-t">사과를 세어 담고 칠판에 적기</title>
  <desc id="b8a-d">탁자 위 사과 세 개를 하나씩 바구니에 담을 때마다 바구니 아래 숫자가 하나씩 늘어나요. 다 담으면 오른쪽 칠판에 사과가 몇 개인지 글로 적혀요.</desc>
  <style>
    .b8a-table{fill:var(--panel);stroke:var(--line);stroke-width:3}
    .b8a-apple{fill:var(--bad);stroke:var(--tx);stroke-width:3}
    .b8a-leaf{fill:var(--ok);stroke:var(--tx);stroke-width:2}
    .b8a-basket{fill:var(--panel2);stroke:var(--tx);stroke-width:3}
    .b8a-weave{fill:none;stroke:var(--line);stroke-width:3}
    #b8a-count{fill:var(--tx);font-size:30px;font-weight:800;text-anchor:middle}
    .b8a-board{fill:var(--code);stroke:var(--line);stroke-width:6}
    #b8a-boardbox.on .b8a-board{stroke:var(--acc)}
    .b8a-label{fill:var(--dim);font-size:20px;text-anchor:middle}
    #b8a-board{fill:var(--tx);font-size:40px;font-weight:800;text-anchor:middle}
  </style>
  <rect class="b8a-table" x="80" y="262" width="320" height="22" rx="8"/>
  <rect class="b8a-table" x="110" y="284" width="18" height="120"/>
  <rect class="b8a-table" x="352" y="284" width="18" height="120"/>
  <g>
    <path class="b8a-basket" d="M470 360 H650 L628 450 H492 Z"/>
    <path class="b8a-weave" d="M478 390 H642 M486 420 H634"/>
  </g>
  <text id="b8a-count" x="560" y="490">0개</text>
  <g id="b8a-boardbox">
    <rect class="b8a-board" x="650" y="110" width="270" height="170" rx="12"/>
    <text class="b8a-label" x="785" y="100">칠판</text>
    <text id="b8a-board" x="785" y="210"> </text>
  </g>
  <g id="b8a-ap1" style="transform:translate(150px,234px)">
    <circle class="b8a-apple" r="26"/><path class="b8a-leaf" d="M0 -26 q10 -16 22 -10 q-8 12 -22 10z"/>
  </g>
  <g id="b8a-ap2" style="transform:translate(240px,234px)">
    <circle class="b8a-apple" r="26"/><path class="b8a-leaf" d="M0 -26 q10 -16 22 -10 q-8 12 -22 10z"/>
  </g>
  <g id="b8a-ap3" style="transform:translate(330px,234px)">
    <circle class="b8a-apple" r="26"/><path class="b8a-leaf" d="M0 -26 q10 -16 22 -10 q-8 12 -22 10z"/>
  </g>
</svg>
