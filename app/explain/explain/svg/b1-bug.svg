<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="b1b-t b1b-d">
  <title id="b1b-t">쪽지 한 줄이 틀려 옆집에 도착</title>
  <desc id="b1b-d">장바구니가 두 칸 가서 갈림길에 와요. 오른쪽으로 돌아야 아래 가게인데 왼쪽으로 돌아 위쪽 옆집에 도착해요. 우유가 없어서 틀린 줄을 찾아요.</desc>
  <style>
    .b1b-tile{fill:var(--panel);stroke:var(--line);stroke-width:3}
    .b1b-roof{fill:var(--warn);stroke:var(--tx);stroke-width:3}
    .b1b-house{fill:var(--panel2);stroke:var(--tx);stroke-width:3}
    .b1b-lbl{fill:var(--dim);font-size:22px;font-weight:700;text-anchor:middle}
    .b1b-milkbox{fill:var(--panel);stroke:var(--acc);stroke-width:3}
    .b1b-cart{fill:var(--panel2);stroke:var(--tx);stroke-width:3}
    .b1b-wheel{fill:var(--tx)}
    .b1b-arrow{fill:none;stroke:var(--acc);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .b1b-good{fill:none;stroke:var(--ok);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:10 8}
    .b1b-xt{fill:var(--bad);font-size:28px;font-weight:800;text-anchor:middle}
    .b1b-ht{fill:var(--ok);font-size:24px;font-weight:800;text-anchor:middle}
  </style>
  <rect class="b1b-tile" x="200" y="230" width="110" height="60" rx="10"/>
  <rect class="b1b-tile" x="325" y="230" width="110" height="60" rx="10"/>
  <rect class="b1b-tile" x="450" y="230" width="110" height="60" rx="10"/>
  <rect class="b1b-tile" x="450" y="130" width="110" height="60" rx="10"/>
  <rect class="b1b-tile" x="450" y="330" width="110" height="60" rx="10"/>
  <text class="b1b-lbl" x="255" y="320">출발</text>
  <path class="b1b-roof" d="M590 120 H710 L690 84 H610 Z"/>
  <rect class="b1b-house" x="600" y="120" width="100" height="80" rx="6"/>
  <text class="b1b-lbl" x="650" y="226">옆집</text>
  <path class="b1b-roof" d="M590 330 H710 L690 296 H610 Z"/>
  <rect class="b1b-house" x="600" y="330" width="100" height="80" rx="6"/>
  <rect class="b1b-milkbox" x="636" y="350" width="28" height="44" rx="3"/>
  <text class="b1b-lbl" x="650" y="436">가게</text>
  <path id="b1b-up" class="b1b-arrow" d="M505 214 V176 M493 190 L505 176 L517 190"/>
  <path id="b1b-dn" class="b1b-good" d="M580 260 Q600 300 580 340"/>
  <g id="b1b-cart" style="transform:translate(255px,280px)">
    <path class="b1b-cart" d="M-36 -50 H36 L27 -14 H-27 Z"/>
    <path class="b1b-cart" d="M36 -50 L46 -62"/>
    <circle class="b1b-wheel" cx="-18" cy="-5" r="6"/><circle class="b1b-wheel" cx="18" cy="-5" r="6"/>
  </g>
  <text id="b1b-x" class="b1b-xt" x="300" y="150">우유가 없어요!</text>
  <text id="b1b-hint" class="b1b-ht" x="770" y="270">오른쪽이 가게</text>
</svg>
