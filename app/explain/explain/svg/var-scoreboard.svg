<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="vs-t vs-d">
  <title id="vs-t">경기 점수판</title>
  <desc id="vs-d">점수판에 숫자 0, 1, 2, 3이 있고 '점수' 이름표가 그중 하나를 가리켜요. 골이 들어갈 때마다 이름표가 다음 숫자로 옮겨 가요. 세 골이 되면 옆에 우승컵이 나타나요.</desc>
  <style>
    .vs-panel{fill:var(--panel);stroke:var(--line);stroke-width:3}
    .vs-card{fill:var(--panel2);stroke:var(--line);stroke-width:3}
    .vs-num{fill:var(--tx);font-size:48px;font-weight:800;text-anchor:middle}
    .vs-lbl{fill:var(--dim);font-size:22px;font-weight:700;text-anchor:middle}
    .vs-tagbox{fill:var(--panel2);stroke:var(--warn);stroke-width:4}
    .vs-hole{fill:var(--panel);stroke:var(--warn);stroke-width:3}
    .vs-tagtx{fill:var(--tx);font-size:26px;font-weight:800;text-anchor:middle}
    .vs-arrow{stroke:var(--warn);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .vs-ball{fill:none;stroke:var(--line);stroke-width:3;}
    .vs-b.on .vs-ball{fill:var(--warn);stroke:var(--warn)}
    .vs-cup{fill:var(--warn);stroke:var(--tx);stroke-width:3}
    .vs-cuptx{fill:var(--warn);font-size:22px;font-weight:800;text-anchor:middle}
    #vs-cup{opacity:0}
    #vs-cup.on{opacity:1}
  </style>
  <g id="vs-board">
    <rect class="vs-panel" x="170" y="210" width="620" height="130" rx="18"/>
    <rect class="vs-card" x="230" y="235" width="80" height="80" rx="10"/><text class="vs-num" x="270" y="292">0</text>
    <rect class="vs-card" x="350" y="235" width="80" height="80" rx="10"/><text class="vs-num" x="390" y="292">1</text>
    <rect class="vs-card" x="470" y="235" width="80" height="80" rx="10"/><text class="vs-num" x="510" y="292">2</text>
    <rect class="vs-card" x="590" y="235" width="80" height="80" rx="10"/><text class="vs-num" x="630" y="292">3</text>
    <text class="vs-lbl" x="730" y="283">점</text>
    <text class="vs-lbl" x="370" y="408">골</text>
    <g id="vs-g1" class="vs-b"><circle class="vs-ball" cx="450" cy="400" r="22"/></g>
    <g id="vs-g2" class="vs-b"><circle class="vs-ball" cx="520" cy="400" r="22"/></g>
    <g id="vs-g3" class="vs-b"><circle class="vs-ball" cx="590" cy="400" r="22"/></g>
    <g id="vs-cup">
      <path class="vs-cup" d="M840 230 H900 V250 Q900 290 870 294 Q840 290 840 250 Z"/>
      <path class="vs-cup" d="M862 294 H878 V312 H892 V324 H848 V312 H862 Z"/>
      <text class="vs-cuptx" x="870" y="356">이겼다</text>
    </g>
  </g>
  <g id="vs-tag" style="transform:translate(270px,0px)">
    <path class="vs-tagbox" d="M-62 122 H44 L64 145 L44 168 H-62 Z"/>
    <circle class="vs-hole" cx="-44" cy="145" r="6"/>
    <text class="vs-tagtx" x="4" y="154">점수</text>
    <path class="vs-arrow" d="M0 170 V226 M-12 212 L0 228 L12 212"/>
  </g>
</svg>
